info:
  name: refresh
  type: http
  seq: 4

http:
  method: POST
  url: "{{BASE_URL}}/auth/refresh"
  body:
    type: json
    data: |-
      {
        "refresh_token": "{{REFRESH_TOKEN}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("TOKEN_TYPE", res.body.token_type);
        bru.setVar("ACCESS_TOKEN", res.body.access_token);
        bru.setVar("REFRESH_TOKEN", res.body.refresh_token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
