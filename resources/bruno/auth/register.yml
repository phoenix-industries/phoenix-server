info:
  name: register
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/auth/register"
  body:
    type: json
    data: |-
      {
        "name": "osama",
        "email": "email@example.com",
        "phone": "+201006822490",
        "birthdate": "2004-06-09T00:00:00.00Z",
        "city": "Faqous",
        "governorate": "Sharqia",
        "address": "Home",
        "password": "lOl@$1212"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("TOKEN_TYPE", res.body.token_type);
        bru.setVar("ACCESS_TOKEN", res.body.access_token);
        bru.setVar("REFRESH_TOKEN", res.body.refresh_token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
