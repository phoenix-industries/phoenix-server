info:
  name: register
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/auth/register"
  body:
    type: json
    data: |-
      {
        "name": "osama",
        "email": "em21211222221@example.com",
        "phone": "+2011111111222114921",
        "birthdate": "2004-06-09T00:00:00.00Z",
        "city": "Faqous",
        "governorate": "Sharqia",
        "address": "Home",
        "password": "lOl@$1212"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body.ok) {
          bru.setVar("TOKEN_TYPE", res.body.data.token_type);
          bru.setVar("ACCESS_TOKEN", res.body.data.access_token);
          bru.setVar("REFRESH_TOKEN", res.body.data.refresh_token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
