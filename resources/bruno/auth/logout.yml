info:
  name: logout
  type: http
  seq: 3

http:
  method: POST
  url: "{{BASE_URL}}/auth/logout"
  headers:
    - name: Authorization
      value: "{{TOKEN_TYPE}} {{ACCESS_TOKEN}}"
  body:
    type: json
    data: |-
      {
        "refresh_token": "{{REFRESH_TOKEN}}"
      }

runtime:
  variables:
    - name: ""
      value: ""
  scripts:
    - type: after-response
      code: |-
        bru.deleteVar("TOKEN_TYPE");
        bru.deleteVar("ACCESS_TOKEN");
        bru.deleteVar("REFRESH_TOKEN");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
