opencollection: 1.0.0

info:
  name: phoenix-server
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: bearer
    token: "{{AUTH_DATA.access_token}}"
  variables:
    - name: HOST
      value: localhost
    - name: PORT
      value: "5000"
    - name: BASE_URL
      value: http://{{HOST}}:{{PORT}}
    - name: BASE_URL
      value: https://osama.alwaysdata.net
      disabled: true
  scripts:
    - type: before-request
      code: |-
        const last = bru.getVar("AUTH_LAST_REFRESH");
        if (Date.now() - last >= 5 * 60 * 1000) {
          await bru.runRequest("auth/refresh");
        }
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
    presets:
      request:
        type: http
        url: "{{BASE_URL}}"
