opencollection: 1.0.0

info:
  name: phoenix-server
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: bearer
    token: "{{ACCESS_TOKEN}}"
  variables:
    - name: HOST
      value: localhost
    - name: PORT
      value: "5000"
    - name: BASE_URL
      value: http://localhost:5000
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
